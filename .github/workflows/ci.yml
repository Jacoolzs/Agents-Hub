name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm -r build
      - run: pnpm audit --prod
      - name: Build private portable preview
        shell: bash
        env:
          AGENTS_HUB_PORTABLE_ARTIFACT: ${{ runner.temp }}/Agents-Hub preview
        run: pnpm package:companion --output "$AGENTS_HUB_PORTABLE_ARTIFACT"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          AGENTS_HUB_PORTABLE_ARTIFACT: ${{ runner.temp }}/Agents-Hub preview
